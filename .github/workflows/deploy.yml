name: 部署 GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - name: Chromium 戰鬥、手機分頁與委任回歸
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: npm run test:browser
      - name: 保存失敗畫面
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-smoke-failure
          path: |
            /tmp/hanmo-v021-failure.png
            /tmp/hanmo-v022-failure.png
            /tmp/hanmo-v023-failure.png
          if-no-files-found: ignore
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 發布
        id: deployment
        uses: actions/deploy-pages@v4
