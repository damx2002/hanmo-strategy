name: 品質檢查與 GitHub Pages
on:
  push:
    branches: [main, feat/v030-core-game]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - name: Chromium 戰鬥、手機分頁、委任與守城回歸
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: npm run test:browser
      - name: 保存失敗畫面
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-smoke-failure
          path: |
            /tmp/hanmo-v021-failure.png
            /tmp/hanmo-v022-failure.png
            /tmp/hanmo-v023-failure.png
            /tmp/hanmo-v030-failure.png
          if-no-files-found: ignore
      - name: 保存分支候選產物（不部署正式站）
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: v030-preview
          path: dist
          retention-days: 14
      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' 
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 發布
        id: deployment
        uses: actions/deploy-pages@v4
